name: Frontend (GitHub Pages)

on:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
      - 'deploy/pages-config.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build --base-href /FleetIQ/

      # Runtime backend URLs (tunnel hosts written by scripts/start-public-demo.ps1),
      # plus 404.html so deep links like /FleetIQ/app/orders fall back to the SPA.
      - name: Add runtime config + SPA fallback
        run: |
          cp ../deploy/pages-config.json dist/sakai-ng/browser/config.json
          cp dist/sakai-ng/browser/index.html dist/sakai-ng/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/sakai-ng/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
