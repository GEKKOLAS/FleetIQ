# Local infrastructure for FleetIQ. Run: docker compose up -d
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fleetiq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (scripts/setup-secrets.ps1)}
      POSTGRES_DB: fleetiq
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./scripts/postgres-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetiq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fleetiq-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-fleetiq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env (scripts/setup-secrets.ps1)}
    ports: ["5672:5672", "15672:15672"]

  redis:
    image: redis:7-alpine
    container_name: fleetiq-redis
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    container_name: fleetiq-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fleetiq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (scripts/setup-secrets.ps1)}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
